name: Pwned Passwords source check

on:
  workflow_dispatch:
  push:
    paths:
      - 'security/pwned-password.mjs'
      - '.github/workflows/pwned-password-source-check.yml'
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify HIBP Pwned Passwords integration
        run: |
          node --input-type=module <<'EOF'
          import { checkPwnedPassword } from './security/pwned-password.mjs';

          const result = await checkPwnedPassword('password');
          if (!result.compromised || result.breachCount < 1) {
            throw new Error('External breached-password source did not return the expected known-compromised result.');
          }

          console.log(`HIBP Pwned Passwords operational; known test password count=${result.breachCount}`);
          EOF

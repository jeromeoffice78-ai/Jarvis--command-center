name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-repo-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Remove obsolete Actions storage while preserving the newest verified encrypted backup
        env:
          GH_TOKEN: ${{ github.token }}
          PRESERVE_ARTIFACT_ID: "10558165297"
          PRESERVE_BACKUP_RUN_ID: "35369499778"
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while read -r id; do
            if [ -z "$id" ] || [ "$id" = "$PRESERVE_ARTIFACT_ID" ]; then
              continue
            fi
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done

          mapfile -t run_ids < <(gh run list --limit 1000 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
          index=0
          for id in "${run_ids[@]}"; do
            index=$((index + 1))
            if [ "$id" = "$GITHUB_RUN_ID" ] || [ "$id" = "$PRESERVE_BACKUP_RUN_ID" ] || [ "$index" -le 10 ]; then
              continue
            fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done

          gh cache delete --all --confirm || true

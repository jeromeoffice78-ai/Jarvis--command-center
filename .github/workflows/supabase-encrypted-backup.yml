name: Supabase encrypted backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || (echo "Missing BACKUP_ENCRYPTION_PASSWORD" && exit 1)

      - name: Create logical backup
        env:
          RAW_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DB_URL="$RAW_SUPABASE_DB_URL"
          DB_URL="${DB_URL//$'\r'/}"
          DB_URL="${DB_URL//$'\n'/}"
          DB_URL="${DB_URL#SUPABASE_DB_URL=}"
          DB_URL="${DB_URL#\"}"
          DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\'}"
          DB_URL="${DB_URL%\'}"
          DB_URL="$(printf '%s' "$DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "SUPABASE_DB_URL is not a PostgreSQL URI after normalization. Edit the GitHub secret and paste only the complete Supabase Session pooler URI beginning with postgresql://"
              exit 1
              ;;
          esac

          if printf '%s' "$DB_URL" | grep -q '\[YOUR-PASSWORD\]'; then
            echo "SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder. Replace it with the real database password in the GitHub secret."
            exit 1
          fi

          pg_dump --dbname="$DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --no-subscriptions \
            --file=jarvis-legal-enterprise.dump

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in jarvis-legal-enterprise.dump \
            -out jarvis-legal-enterprise.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f jarvis-legal-enterprise.dump

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-legal-enterprise-${{ github.run_id }}
          path: jarvis-legal-enterprise.dump.enc
          retention-days: 14
          if-no-files-found: error

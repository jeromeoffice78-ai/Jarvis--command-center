name: Supabase encrypted backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || (echo "Missing BACKUP_ENCRYPTION_PASSWORD" && exit 1)

      - name: Create logical backup with PostgreSQL 17
        env:
          RAW_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DB_URL="$RAW_SUPABASE_DB_URL"
          DB_URL="${DB_URL//$'\r'/}"
          DB_URL="${DB_URL//$'\n'/}"
          DB_URL="${DB_URL#SUPABASE_DB_URL=}"
          DB_URL="${DB_URL#\"}"
          DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\'}"
          DB_URL="${DB_URL%\'}"
          DB_URL="$(printf '%s' "$DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL is not a PostgreSQL URI after normalization."; exit 1 ;;
          esac

          if printf '%s' "$DB_URL" | grep -q '\[YOUR-PASSWORD\]'; then
            echo "SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder."
            exit 1
          fi

          docker pull postgres:17
          docker run --rm \
            -e DB_URL="$DB_URL" \
            -v "$PWD:/backup" \
            postgres:17 \
            bash -lc 'pg_dump --dbname="$DB_URL" --format=custom --no-owner --no-privileges --no-subscriptions --file=/backup/jarvis-legal-enterprise.dump'

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in jarvis-legal-enterprise.dump \
            -out jarvis-legal-enterprise.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f jarvis-legal-enterprise.dump

      - name: Verify decryptability
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in jarvis-legal-enterprise.dump.enc \
            -out jarvis-legal-enterprise.verify.dump \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          test -s jarvis-legal-enterprise.verify.dump

      - name: Restore drill in isolated PostgreSQL 17
        run: |
          set -euo pipefail
          docker rm -f jarvis-restore-test >/dev/null 2>&1 || true
          docker run -d --name jarvis-restore-test \
            -e POSTGRES_PASSWORD=restore_test_only \
            -e POSTGRES_DB=jarvis_restore_test \
            postgres:17
          trap 'docker rm -f jarvis-restore-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if docker exec jarvis-restore-test pg_isready -U postgres -d jarvis_restore_test >/dev/null 2>&1; then break; fi
            sleep 1
          done

          docker exec jarvis-restore-test pg_isready -U postgres -d jarvis_restore_test
          docker cp jarvis-legal-enterprise.verify.dump jarvis-restore-test:/tmp/restore.dump

          # Build a portable restore list. Supabase platform-managed schemas and
          # the supabase_vault extension are intentionally omitted because they
          # are not available in a stock PostgreSQL 17 container.
          docker exec jarvis-restore-test pg_restore -l /tmp/restore.dump > restore.list
          awk '
            / EXTENSION - supabase_vault / {next}
            / COMMENT - EXTENSION supabase_vault / {next}
            /(^|[[:space:]])(vault|auth|storage|realtime|extensions|supabase_functions|supabase_migrations|graphql|graphql_public)([[:space:]]|$)/ {next}
            {print}
          ' restore.list > restore.portable.list
          test -s restore.portable.list
          docker cp restore.portable.list jarvis-restore-test:/tmp/restore.portable.list

          docker exec jarvis-restore-test \
            pg_restore \
              --username=postgres \
              --dbname=jarvis_restore_test \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --use-list=/tmp/restore.portable.list \
              /tmp/restore.dump

          docker exec jarvis-restore-test \
            psql -U postgres -d jarvis_restore_test -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), count(*) AS public_tables FROM pg_tables WHERE schemaname='public';"

          rm -f jarvis-legal-enterprise.verify.dump restore.list restore.portable.list

      - name: Upload encrypted backup artifact
        if: ${{ always() && hashFiles('jarvis-legal-enterprise.dump.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-legal-enterprise-${{ github.run_id }}
          path: jarvis-legal-enterprise.dump.enc
          retention-days: 14
          if-no-files-found: error
